[project]
name = "kanban-backend"
version = "0.1.0"
description = "FastAPI backend for the local Kanban MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx2>=2.16.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = ["openrouter: opt-in live OpenRouter connectivity check"]